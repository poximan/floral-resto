worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    proxy_intercept_errors on;
    error_page 502 503 504 /edge-unavailable.html;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"UP"}';
    }

    location = /edge-unavailable.html {
      root /usr/share/nginx/html;
      internal;
    }

    location / {
      set $edge_gateway_upstream servicoop-edge-gateway:8080;
      proxy_pass http://$edge_gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host floral.internal;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 2s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
  }
}
